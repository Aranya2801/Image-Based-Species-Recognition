<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" width="1200" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f0a"/>
      <stop offset="100%" style="stop-color:#0d1f0d"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="60%" style="stop-color:#86efac"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="60%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)" rx="12"/>
  <rect width="1200" height="300" fill="url(#glow)" rx="12"/>

  <!-- Grid lines -->
  <g stroke="#1e3a1e" stroke-width="0.5" opacity="0.5">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="400" y1="0" x2="400" y2="300"/>
    <line x1="600" y1="0" x2="600" y2="300"/>
    <line x1="800" y1="0" x2="800" y2="300"/>
    <line x1="1000" y1="0" x2="1000" y2="300"/>
  </g>

  <!-- Decorative circles (DNA / cell motif) -->
  <circle cx="80" cy="150" r="60" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.15"/>
  <circle cx="80" cy="150" r="40" fill="none" stroke="#22c55e" stroke-width="0.5" opacity="0.1"/>
  <circle cx="1120" cy="150" r="60" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.15"/>
  <circle cx="1120" cy="150" r="40" fill="none" stroke="#22c55e" stroke-width="0.5" opacity="0.1"/>

  <!-- Leaf icons -->
  <text x="72" y="160" font-size="40" text-anchor="middle" opacity="0.25">🌿</text>
  <text x="1128" y="160" font-size="40" text-anchor="middle" opacity="0.25">🔬</text>

  <!-- Main title -->
  <text x="600" y="110" font-family="'Segoe UI', Arial, sans-serif" font-size="54"
        font-weight="800" text-anchor="middle" fill="url(#textGrad)" letter-spacing="-1">
    Image-Based Species Recognition
  </text>

  <!-- Subtitle -->
  <text x="600" y="158" font-family="'Segoe UI', Arial, sans-serif" font-size="20"
        font-weight="300" text-anchor="middle" fill="#6b9e6b" letter-spacing="2">
    MIT-LEVEL DEEP LEARNING FOR BIODIVERSITY INTELLIGENCE
  </text>

  <!-- Divider line -->
  <line x1="350" y1="178" x2="850" y2="178" stroke="#22c55e" stroke-width="1" opacity="0.4"/>

  <!-- Stats row -->
  <text x="380" y="215" font-family="'Segoe UI', Arial, sans-serif" font-size="26"
        font-weight="700" text-anchor="middle" fill="#4ade80">94.3%</text>
  <text x="380" y="235" font-family="'Segoe UI', Arial, sans-serif" font-size="11"
        text-anchor="middle" fill="#6b9e6b" letter-spacing="1.5">TOP-1 ACCURACY</text>

  <line x1="480" y1="200" x2="480" y2="245" stroke="#1e3a1e" stroke-width="1"/>

  <text x="540" y="215" font-family="'Segoe UI', Arial, sans-serif" font-size="26"
        font-weight="700" text-anchor="middle" fill="#4ade80">10,000+</text>
  <text x="540" y="235" font-family="'Segoe UI', Arial, sans-serif" font-size="11"
        text-anchor="middle" fill="#6b9e6b" letter-spacing="1.5">SPECIES</text>

  <line x1="620" y1="200" x2="620" y2="245" stroke="#1e3a1e" stroke-width="1"/>

  <text x="680" y="215" font-family="'Segoe UI', Arial, sans-serif" font-size="26"
        font-weight="700" text-anchor="middle" fill="#4ade80">47ms</text>
  <text x="680" y="235" font-family="'Segoe UI', Arial, sans-serif" font-size="11"
        text-anchor="middle" fill="#6b9e6b" letter-spacing="1.5">INFERENCE</text>

  <line x1="760" y1="200" x2="760" y2="245" stroke="#1e3a1e" stroke-width="1"/>

  <text x="820" y="215" font-family="'Segoe UI', Arial, sans-serif" font-size="26"
        font-weight="700" text-anchor="middle" fill="#4ade80">3</text>
  <text x="820" y="235" font-family="'Segoe UI', Arial, sans-serif" font-size="11"
        text-anchor="middle" fill="#6b9e6b" letter-spacing="1.5">BACKBONES</text>

  <!-- Bottom badges -->
  <rect x="420" y="258" width="110" height="22" rx="11" fill="#16a34a" opacity="0.25"/>
  <text x="475" y="273" font-family="'Segoe UI', Arial, sans-serif" font-size="11"
        text-anchor="middle" fill="#22c55e" font-weight="600">EfficientNetV2</text>

  <rect x="545" y="258" width="85" height="22" rx="11" fill="#16a34a" opacity="0.25"/>
  <text x="587" y="273" font-family="'Segoe UI', Arial, sans-serif" font-size="11"
        text-anchor="middle" fill="#22c55e" font-weight="600">ViT-Large</text>

  <rect x="645" y="258" width="90" height="22" rx="11" fill="#16a34a" opacity="0.25"/>
  <text x="690" y="273" font-family="'Segoe UI', Arial, sans-serif" font-size="11"
        text-anchor="middle" fill="#22c55e" font-weight="600">ConvNeXt-XL</text>

  <rect x="750" y="258" width="40" height="22" rx="11" fill="#15803d" opacity="0.35"/>
  <text x="770" y="273" font-family="'Segoe UI', Arial, sans-serif" font-size="11"
        text-anchor="middle" fill="#4ade80" font-weight="600">CLIP</text>

  <!-- Border -->
  <rect width="1200" height="300" fill="none" stroke="#1e3a1e" stroke-width="1" rx="12"/>
</svg>
